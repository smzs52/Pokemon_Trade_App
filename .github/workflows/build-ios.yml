name: Build unsigned iOS IPA

# Baut bei jedem Push auf "main" (oder manuell per "Run workflow")
# eine UNSIGNIERTE .ipa und legt sie als Release "latest" mit fester URL ab.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # nötig, damit der Workflow ein Release anlegen darf

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: iOS-Plattform hinzufügen (Capacitor)
        run: npx cap add ios

      - name: Web-Assets synchronisieren
        run: npx cap sync ios

      - name: App unsigniert bauen
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: In unsignierte .ipa verpacken
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/App.app" "Payload/App.app"
          zip -r Tradeliste.ipa Payload
          rm -rf Payload
          echo "Fertig:"; ls -lh Tradeliste.ipa

      - name: IPA als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Tradeliste-unsigned-ipa
          path: Tradeliste.ipa

      - name: IPA als Release veröffentlichen (feste Download-URL)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tradeliste (unsignierte IPA)
          files: Tradeliste.ipa
          make_latest: true
